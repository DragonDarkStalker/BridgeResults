function beginscroll()

function startscroll()
{
    parent.scroll (0, 0);
    yStart = 0;
    nDir = nScroll;
   parent.setTimeout("scrolldown()", nWaitS )
}
function scrolldown()
{
   yWindowMax = parent.document.body.scrollTop
   // check whether scrolling has reached the end
   if ( ( yStart > 0 ) && ( yWindowMax == yTop ) )
   {
      if ( ( yTop > 0 ) && ( yPosition > 0 ) )
      {
        nDir = 0 - nScrollup;
         yTop = 1;
         parent.setTimeout ( "scrolldown()", nWaitE)
        return;
      }
      else
      {
         yPosition = 0;
         parent.scroll ( 0, 0 )
         parent.setTimeout ( "endscroll()", 1)
         return;
      }
   }
   yStart = 1;
   yPosition = yPosition + nDir;
   parent.scroll ( 0, yPosition )
   yTop = yWindowMax
   parent.setTimeout ( "scrolldown()", nSpeed )
}
function endscroll()
{
   page_curr = page_curr + 1;
   var nextpage = "winreload()";
